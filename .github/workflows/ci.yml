name: CI

# Manual only: run it from the repository's Actions tab -> CI -> Run workflow.
on:
  workflow_dispatch:

concurrency:
  group: main-apparel_track-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      - name: Get apps
        working-directory: /home/runner/frappe-bench
        run: |
          # apparel_track is built on ERPNext's stock and buying modules
          bench get-app erpnext --branch develop
          bench get-app apparel_track $GITHUB_WORKSPACE
          bench setup requirements --dev

      - name: Create site with ERPNext
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext

      - name: Set up the Apparel Tracking company
        working-directory: /home/runner/frappe-bench
        run: |
          # the tests expect the company the report describes: Apparel Tracking (AT), Bangladesh
          YEAR=$(date +%Y)
          bench --site test_site execute frappe.desk.page.setup_wizard.setup_wizard.setup_complete \
            --kwargs "{'args': {'language': 'English', 'country': 'Bangladesh', 'timezone': 'Asia/Dhaka', 'currency': 'BDT', 'company_name': 'Apparel Tracking', 'company_abbr': 'AT', 'chart_of_accounts': 'Standard', 'fy_start_date': '${YEAR}-01-01', 'fy_end_date': '${YEAR}-12-31'}}"
          # some tests back-date documents, so the previous year must be open too
          bench --site test_site execute frappe.client.insert \
            --kwargs "{'doc': {'doctype': 'Fiscal Year', 'year': '$((YEAR - 1))', 'year_start_date': '$((YEAR - 1))-01-01', 'year_end_date': '$((YEAR - 1))-12-31'}}"
          bench --site test_site execute frappe.db.get_value --args "['Company', 'Apparel Tracking', 'abbr']"

      - name: Install apparel_track
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site install-app apparel_track
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app apparel_track --skip-before-tests
          bench --site test_site execute apparel_track.tests.demo_scenarios.run --kwargs "{'color': False}"
        env:
          TYPE: server
